name: Nix Composite
author: ncaq
description: Install Nix and push store paths to niks3

branding:
  icon: "package"
  color: "purple"

inputs:
  free-disk-space:
    description: >-
      Free up disk space by removing pre-installed software on GitHub-hosted Ubuntu runners.
      Enables only the high-ROI options (fast removals of large directories).
      The slow apt-based large-packages and the risky preinstalled-runtimes options are kept disabled.
      Has no effect on self-hosted or non-Linux runners.
    required: false
    default: "true"
  extra-nix-config:
    description: Append nix.conf settings
    required: false
    default: ""
  niks3-endpoint:
    description: niks3 server endpoint URL
    required: false
    default: "https://niks3-public.ncaq.net"
  niks3-drain-timeout:
    description: >-
      Seconds the post step waits for the niks3 upload daemon to finish uploading.
      Raised from the upstream default of 600 because timeouts happen on heavy builds,
      where losing the cache costs far more than spending extra minutes on the upload.
    required: false
    default: "3600"

runs:
  using: composite
  steps:
    # 空き容量を増やすため、
    # Nixをインストールする前に不要なプリインストールソフトウェアを削除します。
    # GitHubホステッドのLinuxランナーでのみ実行します。
    # 費用対効果の観点から、
    # 高速かつ大容量を解放できて、
    # Nixなどによって、
    # どうせ使わないであろうパッケージを消すオプションのみ有効化します。
    - name: Free disk space
      if: >-
        inputs.free-disk-space == 'true' &&
        runner.os == 'Linux' &&
        runner.environment == 'github-hosted'
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
      with:
        android: true
        docker-images: false
        dotnet: true
        haskell: true
        large-packages: false
        preinstalled-runtimes: false
        swap-storage: false

    - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      with:
        # セルフホストランナーでうっかり外部からの悪意あるPRを実行許可してしまい、
        # そのまま`flake.nix`の設定を受け入れるとリスクが比較的高いため、
        # リスク軽減のためにGitHubホステッドランナーでのみ、
        # `flake.nix`の設定を自動で受け入れるようにしています。
        # GitHubホステッドランナーは荒らされても比較的安全なので受け入れるようにしています。
        # GitHubホステッドランナーでは`runner.environment`は`github-hosted`になります。
        # 仮に値が`github-hosted`にならなくてもキャッシュリストが読み込まれないだけなので、
        # リスクはありません。
        extra_nix_config: |
          ${{ runner.environment == 'github-hosted' && 'accept-flake-config = true' || '' }}
          ${{ inputs.extra-nix-config }}

    # niks3-actionはデフォルトではGitHubのリリースアセットからniks3を取得しますが、
    # リリースアセットのサーバは度々ダウンするため、
    # このアクション自身のflakeからNix経由で取得します。
    # 大抵はバイナリキャッシュにヒットし、
    # 最悪ビルドすることになってもGo製なので負荷は軽いです。
    # セルフホストランナーでジョブ中にGCされないように、
    # `RUNNER_TEMP`にGCルートを作成します。
    # `$RUNNER_TEMP/niks3`はniks3-actionが作業ディレクトリとして使うため、
    # 衝突しない名前にしています。
    - name: Build niks3
      id: niks3
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        out="$(nix build --no-update-lock-file --print-out-paths --out-link "$RUNNER_TEMP/nix-composite-action-niks3-gcroot" "$ACTION_PATH#niks3")"
        echo "bin=$out/bin/niks3" >> "$GITHUB_OUTPUT"

    # OIDC認証を使うのでsecretは不要です。
    # セルフホステッドランナーで`trusted-users`に含まれない場合は、
    # `post-build-hook`ではなく`/nix/store`のスキャンによるpushに自動でフォールバックします。
    - name: Setup niks3 cache
      uses: Mic92/niks3-action@6c79855e3e7d8e62ca74234519438a858003abe1 # v1.7.0
      with:
        server-url: "${{ inputs.niks3-endpoint }}"
        niks3-bin: "${{ steps.niks3.outputs.bin }}"
        # フォークからのPRはキャッシュへのプッシュをスキップ。
        skip-push: ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository }}
        # アップロードが終わらないうちにデーモンを殺すとキャッシュが欠落します。
        # 重いビルドほどアップロード量が多くてタイムアウトしやすく、
        # そしてそういうビルドほどキャッシュが欠落した時の再ビルドコストが高いため、
        # 上流のデフォルトより大幅に長く待ちます。
        drain-timeout: "${{ inputs.niks3-drain-timeout }}"
