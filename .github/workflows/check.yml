name: check

on:
  push:
    branches: [master, main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-fast-build:
    name: nix-fast-build
    # アクション自体の動作をプラットフォームごとに検証するため、
    # flake.nixの`systems`に対応するランナーで実行します。
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04 # x86_64-linux
          - ubuntu-26.04-arm # aarch64-linux
          - macos-26 # aarch64-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # リポジトリコンテンツの読み取り
      id-token: write # niks3 OIDC認証
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # actionlintが`$/`構文に未対応なので従来の`./`を使う。https://github.com/rhysd/actionlint/issues/711
      - uses: ./ # zizmor: ignore[self-repository]
      # アクションはniks3-actionをセットアップする前にniks3をビルドするため、
      # その時点では`post-build-hook`が設定されておらず、
      # niks3自身はキャッシュにpushされません。
      # 後続のビルドでもローカルに既にあるniks3は再ビルドされないためフックは発火しません。
      # アクションの利用者がniks3をキャッシュから取得できるように、
      # このリポジトリのCIでだけ明示的にフックを呼び出してpushします。
      # フォークからのPRはアクションがpushをスキップするため、このステップもスキップします。
      # それ以外で`post-build-hook`が設定されていないのは設定漏れなので失敗させます。
      - name: Push niks3 to cache
        id: push-niks3
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          hook="$(nix config show post-build-hook)"
          if [[ -z "$hook" ]]; then
            echo "::error::post-build-hook is not set although this job should push to the cache"
            exit 1
          fi
          out="$(nix build --no-update-lock-file --no-link --print-out-paths '.#niks3')"
          OUT_PATHS="$out" "$hook"
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - run: >-
          nix run '.#nix-fast-build' --
          --option eval-cache false
          --no-link
          --skip-cached
          --no-nom
      # フックはアップロードデーモンのキューに積むだけなので、
      # niks3が実際にキャッシュに届いたことを検証します。
      # デーモンはキューに積まれるとすぐにアップロードを始めますが、
      # 完了を待つのはジョブの最後のpostステップなので、
      # この時点ではまだ終わっていない可能性があります。
      # そのため届くまでしばらくリトライします。
      # Nixは存在しないという結果をキャッシュするため、
      # リトライが意味を持つように`narinfo-cache-negative-ttl`を0にします。
      - name: Check niks3 is in cache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          NIKS3_OUT: ${{ steps.push-niks3.outputs.out }}
        run: |
          for _ in {1..30}; do
            if nix path-info --option narinfo-cache-negative-ttl 0 --store 'https://niks3-public.ncaq.net' "$NIKS3_OUT"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::niks3 is not in the cache: $NIKS3_OUT"
          exit 1

  # niks3-actionは自身が固定するniks3のバージョンを前提に`niks3-hook`の引数を組み立てます。
  # niks3はflake.nixで固定した上流のコミットから取得しているため、
  # niks3-actionとflake.nixのどちらか片方だけが更新されるとバージョンがずれます。
  # Renovateは両者を同じPRで更新するようにグループ化していますが、
  # 上流のリリースが対応しない場合などにずれたまま気付かずにリリースしないように、
  # 両者のバージョンが一致することを検査します。
  niks3-version:
    name: niks3-version
    runs-on: ubuntu-26.04
    permissions:
      contents: read # リポジトリコンテンツの読み取り
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - name: Compare niks3 version with niks3-action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="$(yq -r '.runs.steps[] | select(.uses // "" | test("(?i)^mic92/niks3-action@")) | .uses | sub("(?i)^mic92/niks3-action@"; "")' action.yml)"
          # refが空だとGitHub APIはデフォルトブランチの内容を返してしまい、
          # 固定したコミットとは無関係な値と比較することになるため、
          # 一意なコミットSHAとして取り出せたことを確認します。
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::failed to extract a unique pinned commit SHA of niks3-action from action.yml: '$ref'"
            exit 1
          fi
          expected="$(gh api -H 'Accept: application/vnd.github.raw' "repos/Mic92/niks3-action/contents/NIKS3_VERSION?ref=$ref")"
          expected="${expected#v}"
          if [[ -z "$expected" ]]; then
            echo "::error::failed to fetch NIKS3_VERSION of niks3-action@$ref"
            exit 1
          fi
          actual="$(nix eval --raw '.#niks3.version')"
          echo "niks3-action@$ref expects niks3 $expected, flake provides $actual"
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::niks3 version mismatch: niks3-action expects $expected but flake provides $actual"
            exit 1
          fi
